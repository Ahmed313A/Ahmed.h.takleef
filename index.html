<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>موقعي الشخصي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --font-main: 'Tajawal', sans-serif;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --accent: #6366f1;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.4);
      --radius-lg: 1.5rem;
      --radius-md: 1rem;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
      position: relative;
    }

    .animated-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute; border-radius: 50%; background: var(--accent);
      opacity: 0.04; animation: floatUp 20s infinite ease-in-out;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.06; }
      50% { opacity: 0.03; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--surface); display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.6s, visibility 0.6s;
    }
    .loading-screen.hidden { opacity: 0; visibility: hidden; }
    .loader-logo { text-align: center; animation: pulse 1.8s infinite; }
    .loader-logo i { font-size: 4rem; color: var(--accent); margin-bottom: 0.5rem; }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.7; }
    }

    .container { max-width: 900px; margin: 0 auto; padding: 1.25rem; }

    .hero { text-align: center; padding: 2.5rem 1rem 1.5rem; }
    .profile-pic-wrapper { display: inline-block; position: relative; margin-bottom: 1.8rem; }
    .profile-pic {
      width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
      border: 4px solid var(--accent); box-shadow: 0 10px 25px rgba(99,102,241,0.3);
      transition: transform var(--transition);
    }
    .profile-pic:hover { transform: scale(1.04); }

    /* إطار الاسم المتحرك بدون خلفية */
    .name-wrapper {
      display: inline-block;
      margin: 0.5rem auto 0.8rem;
      padding: 0.3rem 2.2rem;
      border-radius: 3rem;
      position: relative;
      background: transparent;
    }
    .name-wrapper::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 3rem;
      background: linear-gradient(45deg, var(--accent), #a78bfa, var(--accent));
      z-index: -1;
      background-size: 200% 200%;
      animation: rotateBorder 4s linear infinite;
    }
    @keyframes rotateBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero h1 {
      font-size: 1.5rem; font-weight: 700; letter-spacing: -0.3px;
      color: var(--text);
      position: relative;
      background: var(--bg);
      border-radius: 2.8rem;
      padding: 0.4rem 1.5rem;
      margin: 0;
    }

    .hero .description-lines {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 1rem auto 1.8rem;
      line-height: 2;
    }
    .description-lines p { margin: 0.3rem 0; }

    .section {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.8rem;
      margin: 1.5rem 0;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .section.visible { opacity: 1; transform: translateY(0); }
    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.7rem;
    }
    .section-title i { color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.3rem; }

    /* قسم حسابات التواصل - خلفية بنفسجية فاتحة */
    .social-section {
      background: #ede9fe;
      border-radius: var(--radius-lg);
      padding: 1.8rem;
      margin: 1.5rem 0;
      box-shadow: var(--shadow-sm);
      color: #1f2937;
    }
    .social-section .section-title { border-bottom-color: #c4b5fd; color: #4c1d95; }
    .social-section .section-title i { color: #7c3aed; }

    .social-cards { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    .social-card {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.8rem 1.5rem; border-radius: 2.5rem;
      text-decoration: none; color: #fff; font-weight: 500;
      transition: transform 0.3s, box-shadow 0.3s;
      min-width: 140px;
      border: 2px solid transparent;
      animation: cardGlow 4s infinite alternate;
    }
    @keyframes cardGlow {
      0% { border-color: rgba(255,255,255,0.2); box-shadow: 0 0 8px currentColor; }
      100% { border-color: rgba(255,255,255,0.5); box-shadow: 0 0 18px currentColor; }
    }
    .social-card i { font-size: 1.4rem; }
    .social-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

    /* إنجازات */
    .achievement-card {
      background: linear-gradient(145deg, rgba(99,102,241,0.12), transparent);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 1.4rem; transition: all 0.4s ease;
    }
    .achievement-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(99,102,241,0.2);
      border-color: var(--accent);
    }
    .achievement-card h3 { margin-bottom: 0.5rem; color: var(--accent); }

    /* معرض */
    .gallery-card {
      background: var(--surface); border-radius: var(--radius-md); overflow: hidden;
      border: 1px solid var(--border); transition: all var(--transition);
    }
    .gallery-card img { width: 100%; height: 200px; object-fit: cover; }
    .gallery-info { padding: 1rem; }
    .gallery-info p { color: var(--text-secondary); margin: 0.3rem 0; }
    .gallery-info .date { font-size: 0.8rem; color: var(--accent); }

    footer { text-align: center; padding: 2rem 1rem; color: var(--text-secondary); font-size: 0.9rem; }
    footer a { color: var(--accent); text-decoration: none; margin: 0 0.5rem; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.25rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="animated-bg" id="animatedBg"></div>

  <div class="loading-screen" id="loadingScreen">
    <div class="loader-logo">
      <i class="fas fa-star"></i>
      <h2 style="font-weight:500;">أهلاً بك</h2>
    </div>
  </div>

  <div class="container" id="mainContent">
    <div class="hero">
      <div class="profile-pic-wrapper">
        <img id="profileImage" src="https://placehold.co/300x300/e2e8f0/6366f1?text=😎" alt="صورتي" class="profile-pic">
      </div>
      <div class="name-wrapper">
        <h1 id="siteName">اسمك هنا</h1>
      </div>
      <div class="description-lines" id="siteDescription">
        <p>مهتم بالشأن السياسي والفكر الديني</p>
        <p>احد افراد التيار الوطني الشيعي</p>
        <p>‌طالب في جامعة القادسية / كلية القانون</p>
      </div>
    </div>

    <div id="sectionsContainer"></div>

    <footer>
      <p>© <span id="currentYear"></span> جميع الحقوق محفوظة.</p>
      <div>
        <a href="#" id="privacyLink">سياسة الخصوصية</a> |
        <a href="#" id="termsLink">شروط الاستخدام</a>
      </div>
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, get, onValue, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcd2WAU57-1Fj-Fa0jD5uhB3AB4D7Vxec",
      authDomain: "the-two-brothers.firebaseapp.com",
      databaseURL: "https://the-two-brothers-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "the-two-brothers",
      storageBucket: "the-two-brothers.firebasestorage.app",
      messagingSenderId: "654043569338",
      appId: "1:654043569338:web:f67007583233066367f683",
      measurementId: "G-KYYJG3GSY5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    getAnalytics(app);

    // الحسابات الافتراضية الثابتة
    const DEFAULT_SOCIAL_LINKS = [
      { platform: "Instagram", url: "https://www.instagram.com/ahmed.h.takleef?igsh=Y3QwMThwN2pxemJ6", icon: "fab fa-instagram", color: "linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888)" },
      { platform: "Facebook", url: "https://www.facebook.com/AHMED.H.TAKLIF?mibextid=ZbWKwL", icon: "fab fa-facebook", color: "#1877f2" },
      { platform: "Threads", url: "https://www.threads.com/@ahmed.h.takleef", icon: "fab fa-threads", color: "#ffffff", textColor: "#000000" },
      { platform: "Telegram", url: "https://t.me/ily_no1", icon: "fab fa-telegram-plane", color: "#0088cc" }
    ];

    const loadingScreen = document.getElementById('loadingScreen');

    setTimeout(() => {
      if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
        loadingScreen.classList.add('hidden');
      }
    }, 3000);

    async function loadSiteData() {
      try {
        const snap = await get(ref(db, '/'));
        return snap.val() || {};
      } catch (e) { return {}; }
    }

    function applySiteSettings(data) {
      const siteInfo = data.siteInfo || {};
      document.getElementById('siteName').textContent = siteInfo.name || 'اسمك هنا';
      if (siteInfo.profileImage) document.getElementById('profileImage').src = siteInfo.profileImage;
      if (siteInfo.primaryColor) {
        document.documentElement.style.setProperty('--accent', siteInfo.primaryColor);
      }
    }

    function getSocialLinks(data) {
      if (data.socialLinksOrder && data.socialLinksOrder.length === 4) {
        return data.socialLinksOrder.map(platform => DEFAULT_SOCIAL_LINKS.find(l => l.platform === platform)).filter(Boolean);
      }
      if (data.socialLinks && data.socialLinks.length === 4) {
        // قديمة
        return data.socialLinks;
      }
      return DEFAULT_SOCIAL_LINKS;
    }

    function renderSections(data) {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = '';

      // حسابات التواصل
      const social = getSocialLinks(data);
      const socialSec = document.createElement('div');
      socialSec.className = 'social-section'; // لاحظ ليس section ليكون بلون مختلف
      socialSec.innerHTML = buildSocialSection(social);
      container.appendChild(socialSec);

      // من أنا
      if (data.about && data.about.content) {
        const sec = document.createElement('div'); sec.className = 'section';
        sec.innerHTML = `<div class="section-title"><i class="fas fa-user"></i> من أنا</div><p>${data.about.content}</p>`;
        container.appendChild(sec);
      }

      // إنجازاتي
      const achievements = data.achievements || [];
      if (achievements.length) {
        const sec = document.createElement('div'); sec.className = 'section';
        sec.innerHTML = buildAchievementsSection(achievements);
        container.appendChild(sec);
      }

      // المعرض
      const gallery = data.gallery || [];
      if (gallery.length) {
        const sec = document.createElement('div'); sec.className = 'section';
        sec.innerHTML = buildGallerySection(gallery);
        container.appendChild(sec);
      }

      // باقي الأقسام لو وجدت
      if (data.projects && data.projects.length) {
        const sec = document.createElement('div'); sec.className = 'section';
        sec.innerHTML = buildProjectsSection(data.projects);
        container.appendChild(sec);
      }
      if (data.blog && data.blog.length) {
        const sec = document.createElement('div'); sec.className = 'section';
        sec.innerHTML = buildBlogSection(data.blog);
        container.appendChild(sec);
      }
      if (data.products && data.products.length) {
        const sec = document.createElement('div'); sec.className = 'section';
        sec.innerHTML = buildStoreSection(data.products);
        container.appendChild(sec);
      }

      observeSections();
    }

    function buildSocialSection(links) {
      let html = `<div class="section-title"><i class="fas fa-share-alt"></i> حساباتي</div><div class="social-cards">`;
      links.forEach(link => {
        const style = link.color.includes('gradient') ? `background: ${link.color};` : `background: ${link.color};`;
        const textColor = link.textColor ? `color: ${link.textColor};` : '';
        html += `<a href="${link.url}" target="_blank" class="social-card" style="${style}${textColor}">
          <i class="${link.icon}"></i> ${link.platform}
        </a>`;
      });
      html += '</div>';
      return html;
    }

    function buildAchievementsSection(items) {
      let html = `<div class="section-title"><i class="fas fa-trophy"></i> إنجازاتي</div><div class="grid">`;
      items.forEach(a => html += `<div class="achievement-card"><h3>${a.title}</h3><p>${a.description}</p></div>`);
      return html + '</div>';
    }

    function buildGallerySection(items) {
      let html = `<div class="section-title"><i class="fas fa-images"></i> المعرض</div><div class="grid">`;
      items.forEach(img => html += `<div class="gallery-card"><img src="${img.imageUrl}" alt="صورة"><div class="gallery-info"><p>${img.description||''}</p><div class="date">${img.date||''}</div></div></div>`);
      return html + '</div>';
    }

    function buildProjectsSection(items) {
      let html = `<div class="section-title"><i class="fas fa-code"></i> المشاريع</div><div class="grid">`;
      items.forEach(p => html += `<div style="background:var(--surface); border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border);"><img src="${p.image||'https://placehold.co/400x250/e2e8f0/6366f1?text=مشروع'}" style="width:100%;height:170px;object-fit:cover;"><div style="padding:1rem;"><h3>${p.title}</h3><p>${p.description}</p><a href="${p.link||'#'}" target="_blank" style="color:var(--accent);">تفاصيل</a></div></div>`);
      return html + '</div>';
    }

    function buildBlogSection(items) {
      let html = `<div class="section-title"><i class="fas fa-pen"></i> المدونة</div><div class="grid">`;
      items.forEach(a => html += `<div style="background:var(--surface); border-radius:var(--radius-md); padding:1rem; border:1px solid var(--border);"><h3>${a.title}</h3><p>${(a.content||'').substring(0,80)}...</p><small>${a.date||''}</small></div>`);
      return html + '</div>';
    }

    function buildStoreSection(products) {
      let html = `<div class="section-title"><i class="fas fa-store"></i> المتجر</div><div class="grid">`;
      products.forEach(p => html += `<div style="background:var(--surface); border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border);"><img src="${(p.images&&p.images[0])||'https://placehold.co/400x250/e2e8f0/6366f1?text=منتج'}" style="width:100%;height:170px;object-fit:cover;"><div style="padding:1rem;"><h3>${p.name}</h3><p>${p.description}</p><div style="color:var(--accent); font-weight:700;">${p.price} ريال</div></div></div>`);
      return html + '</div>';
    }

    function observeSections() {
      document.querySelectorAll('.section, .social-section').forEach(sec => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.15 });
        observer.observe(sec);
      });
    }

    function createParticles() {
      const bg = document.getElementById('animatedBg');
      for (let i=0; i<18; i++) {
        const p = document.createElement('div'); p.className = 'particle';
        const size = Math.random()*70+20;
        Object.assign(p.style, { width: size+'px', height: size+'px', left: Math.random()*100+'%', animationDelay: Math.random()*20+'s', animationDuration: 15+Math.random()*20+'s' });
        bg.appendChild(p);
      }
    }

    async function incrementVisitorCount() {
      try {
        const vRef = ref(db, 'stats/visitors');
        const snap = await get(vRef);
        await set(vRef, (snap.val()||0)+1);
      } catch(e) {}
    }

    window.addEventListener('DOMContentLoaded', async () => {
      createParticles();
      try {
        const data = await loadSiteData();
        applySiteSettings(data);
        renderSections(data);
        incrementVisitorCount();
      } catch (e) { console.error(e); }
      document.getElementById('currentYear').textContent = new Date().getFullYear();
    });

    if (db) {
      onValue(ref(db, '/'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
          applySiteSettings(data);
          renderSections(data);
        }
      });
    }
  </script>
</body>
</html>
